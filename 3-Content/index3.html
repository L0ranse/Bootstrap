<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bootstrap demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous" />
</head>

<body>
  <div class="container mt-4">
    <h1>img-fluid</h1>
    <img src="https://picsum.photos/200/300" alt="Responsive image"> <!--Farkı görmek için tarayıcıyı küçültün.  -->
    <img src="https://picsum.photos/200/300" class="img-fluid" alt="Responsive image">

    <h2>img-thumbnail</h2>
    <img src="https://picsum.photos/200/300" class="img-thumbnail" alt="Responsive image">
    <img src="https://picsum.photos/200/300" class="img-fluid img-thumbnail-rounded" alt="Responsive image">
    <img src="https://picsum.photos/200/300" alt="Responsive image">
    <h3>rounded</h3>
    <img src="https://picsum.photos/200/300" class="rounded" alt="Responsive image">
    <h4>rounded-circle</h4>
    <img src="https://picsum.photos/200/300" class="rounded-circle" alt="Responsive image">
    <h5>rounded-pill</h5>
    <img src="https://picsum.photos/200/300" class="rounded-pill" alt="Responsive image">
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-OERcA2EqjJCMA+/3y+gxIOqMEjwtxJY7qPCqsdltbNJuaOe923+mo//f6V8Qbsw3"
    crossorigin="anonymous"></script>
</body>

</html>
