<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bootstrap Form Ders Notu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous" />
</head>

<body>
  <div class="container mt-4 col-xxl-8 addEventListener">
    <div class="row">
      <div class="col mx-auto">
        <form class="needs-validation" novalidate>
          <div class="row g-3 mb-3" novalidate>
            <div class="col-5">
              <div class="form-floating">
                <input type="text" class="form-control" id="firstName" placeholder="First name" required>
                <label for="firstName">First name</label>
                <div class="invalid-feedback">Please enter your first name.</div>
                <div class="valid-feedback">Looks good!</div>
              </div>
            </div>
            <div class="col-7">
              <div class="form-floating">
                <input type="text" class="form-control" id="lastName" placeholder="Last name" required>
                <label for="lastName">Last name</label>
                <div class="invalid-feedback">Please enter your last name.</div>
                <div class="valid-feedback">Looks good!</div>
              </div>
            </div>
          </div>
          <div class="row mb-3">
            <label for="colFormLabelSm" class="col-sm-2 col-form-label col-form-label-lg">Email</label>
            <div class="col-sm-10">
              <input type="email" class="form-control form-control-sm" id="colFormLabelSm"
                placeholder="example@example.com" required>
              <div class="invalid-feedback">Please enter a valid email address.</div>
              <div class="valid-feedback">Valid email address!</div>
            </div>
          </div>
          <div class="row mb-3">
            <label for="colFormLabel" class="col-sm-2 col-form-label">Password</label>
            <div class="col-sm-10">
              <input type="password" class="form-control" id="colFormLabel" placeholder="Password" required>
              <div class="invalid-feedback">Please enter your password.</div>
              <div class="valid-feedback">Password entered!</div>
            </div>
          </div>
          <div class="row mb-3">
            <label for="colFormLabelLg" class="col-sm-2 col-form-label col-form-label-lg">Address</label>
            <div class="col-sm-10">
              <input type="text" class="form-control form-control-lg" id="colFormLabelLg" placeholder="Address"
                required>
              <div class="invalid-feedback">Please enter your address.</div>
              <div class="valid-feedback">Address entered!</div>
            </div>
          </div>
          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" value="" id="flexCheckDefault" required>
            <label class="form-check-label" for="flexCheckDefault">
              I agree to the terms and conditions
            </label>
            <div class="invalid-feedback">You must agree before submitting.</div>
            <div class="valid-feedback">Thank you for agreeing!</div>
          </div>
          <button type="submit" class="btn btn-primary btn-lg float-end">Submit</button>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-OERcA2EqjJCMA+/3y+gxIOqMEjwtxJY7qPCqsdltbNJuaOe923+mo//f6V8Qbsw3" crossorigin="anonymous">

    </script>
  <script>
    (() => {
      'use strict'

      const forms = document.querySelectorAll('.needs-validation')

      Array.from(forms).forEach(form => {
        form.addEventListener('input', () => {
          form.classList.add('was-validated')
        })

        form.addEventListener('submit', event => {
          if (!form.checkValidity()) {
            event.preventDefault()
            event.stopPropagation()
          }

          form.classList.add('was-validated')
        }, false)
      })
    })()
  </script>
</body>

</html>
