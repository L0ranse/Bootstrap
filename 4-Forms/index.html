<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bootstrap Form Ders Notu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous" />
</head>

<body>

  <div class="container mt-4">
    <form>
      <div class="mb-3">
        <label for="exampleInputEmail1" class="form-label">Email address</label>
        <!--
          form-control: Input'u Bootstrap görünümüne getirir ve genişliğini ayarlar.
          type="email": Tarayıcı e-posta formatını kontrol eder.
          Eğer type="text" yazsaydık, e-posta formatı kontrol edilmezdi.
          id ile label içindeki for aynı olmalıdır; böylece etikete tıklayınca input seçilir.
        -->
        <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" />
        <!-- form-text: Yardımcı açıklama metni için kullanılır. -->
        <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
      </div>
      <div class="mb-3">
        <label for="exampleInputPassword1" class="form-label">Password</label>
        <!-- type="password" yazdığımız için girilen karakterler gizlenir. -->
        <input type="password" class="form-control" id="exampleInputPassword1" />
      </div>
      <!-- form-check: Checkbox ve label'ın düzgün hizalanmasını sağlar. -->
      <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="exampleCheck1" />
        <label class="form-check-label" for="exampleCheck1">Check me out</label>
      </div>
      <!--
        btn: Butonu Bootstrap biçimine sokar.
        btn-primary: Mavi, birincil buton stilini verir.
        Örneğin class="btn btn-danger" yazsaydık buton kırmızı olurdu.
        type="submit", form gönderildiğinde submit işlemini başlatır.
      -->
      <button type="submit" class="btn btn-primary">Submit</button>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-OERcA2EqjJCMA+/3y+gxIOqMEjwtxJY7qPCqsdltbNJuaOe923+mo//f6V8Qbsw3"
    crossorigin="anonymous"></script>
</body>

</html>
